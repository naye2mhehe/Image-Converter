<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Image Converter </title>
    <!-- আপনার ওয়েবসাইটের লোগো বা ফ্যাভিকন এখানে সেট করুন --> 
    <link rel="icon" type="image/png" href="logo/abbu_logo.png">
    
    <!-- jsPDF Library for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .drop-area {
            border: 3px dashed #38bdf8;
            padding: 50px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 20px;
            background: #334155;
            transition: 0.3s;
        }

        .drop-area.active {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .controls {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="number"], select {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 14px;
        }

        button {
            padding: 12px 25px;
            border: none;
            background: #22c55e;
            color: white;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin: 5px;
        }

        button:hover { background: #16a34a; }
        .download-btn { background: #38bdf8; }
        .download-btn:hover { background: #0284c7; }
        
        .pdf-btn { background: #e11d48; }
        .pdf-btn:hover { background: #be123c; }

        .toggle-btn { background: #64748b; }
        .toggle-btn.on { background: #f59e0b; color: #000; }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .preview-item {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            position: relative;
        }

        .preview-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 4px;
        }

        .download-link {
            display: block;
            margin-top: 10px;
            color: #38bdf8;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }

        #fileInput { display: none; }
    </style>
</head>

<body>

<div class="container">
    <h2> Image Converter</h2>
    
    <div class="drop-area" id="dropArea">
        <p id="dropText">এখানে ছবি ড্র্যাগ করুন অথবা ক্লিক করে আপলোড করুন</p>
        <input type="file" id="fileInput" multiple accept="image/*">
    </div>

    <div class="controls">
        <input type="number" id="width" placeholder="Width (ঐচ্ছিক)">
        <input type="number" id="height" placeholder="Height (ঐচ্ছিক)">
        
        <select id="format">
            <optgroup label="জনপ্রিয় ফরম্যাট⬇️ ">
                <option value="image/png">PNG ফরম্যাট</option>
                <option value="image/jpeg">JPG / JPEG ফরম্যাট</option>
                <option value="image/webp">WebP ফরম্যাট</option>
            </optgroup>
            <optgroup label="অন্যান্য ফরম্যাট ⬇️">
                <option value="image/avif">AVIF ফরম্যাট</option>
                <option value="image/bmp">BMP ফরম্যাট</option>
                <option value="image/gif">GIF ফরম্যাট</option>
                <option value="image/x-icon">ICO ফরম্যাট</option>
                <option value="image/tiff">TIFF ফরম্যাট</option>
            </optgroup>
        </select>
    </div>

    <button onclick="convertImages()">Convert</button>
    <button class="download-btn" onclick="downloadAllImages()">Download All</button>
    <button class="pdf-btn" onclick="convertToPDF()">Save as PDF</button>
    <button id="qualityToggle" class="toggle-btn" onclick="toggleQuality()">Quality Boost: OFF</button>

    <div class="preview-container" id="previewContainer"></div>
</div>

<script>
    const dropArea = document.getElementById('dropArea');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const qualityToggle = document.getElementById('qualityToggle');
    
    let selectedFiles = [];
    let convertedResults = [];
    let isQualityBoosted = false;

    function toggleQuality() {
        isQualityBoosted = !isQualityBoosted;
        qualityToggle.innerText = isQualityBoosted ? "Quality Boost: ON" : "Quality Boost: OFF";
        qualityToggle.classList.toggle('on', isQualityBoosted);
    }

    dropArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    dropArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropArea.classList.add('active');
    });

    dropArea.addEventListener('dragleave', () => dropArea.classList.remove('active'));

    dropArea.addEventListener('drop', (e) => {
        e.preventDefault();
        dropArea.classList.remove('active');
        handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
        const fileList = Array.from(files);
        selectedFiles = [...selectedFiles, ...fileList];
        renderInitialPreview(fileList);
    }

    function renderInitialPreview(files) {
        files.forEach(file => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `<img src="${e.target.result}"><p style="font-size:10px; margin:5px 0; overflow:hidden;">${file.name}</p>`;
                previewContainer.appendChild(div);
            };
        });
    }

    function convertImages() {
        if (selectedFiles.length === 0) {
            alert("দয়া করে আগে ছবি আপলোড করুন!");
            return;
        }

        convertedResults = [];
        previewContainer.innerHTML = "<h3>প্রসেসিং হচ্ছে...</h3>";
        
        const targetFormat = document.getElementById('format').value;
        const targetWidth = parseInt(document.getElementById('width').value);
        const targetHeight = parseInt(document.getElementById('height').value);
        
        let ext = targetFormat.split('/')[1].replace('jpeg', 'jpg').replace('x-icon', 'ico').replace('tiff', 'tif');

        let processedCount = 0;

        selectedFiles.forEach((file) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    canvas.width = targetWidth || img.width;
                    canvas.height = targetHeight || img.height;

                    if (isQualityBoosted) {
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                    }

                    if (targetFormat === "image/jpeg" || targetFormat === "image/bmp") {
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const qualityValue = isQualityBoosted ? 1.0 : 0.9;
                    const dataURL = canvas.toDataURL(targetFormat, qualityValue);
                    
                    // মূল নাম সংরক্ষণ করা হচ্ছে (এক্সটেনশন বাদে)
                    const originalName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                    const fileName = `${originalName}.${ext}`;
                    
                    convertedResults.push({ 
                        data: dataURL, 
                        name: fileName, 
                        width: canvas.width, 
                        height: canvas.height 
                    });

                    processedCount++;
                    if (processedCount === selectedFiles.length) {
                        displayConvertedImages(ext);
                    }
                };
            };
        });
    }

    function displayConvertedImages(ext) {
        previewContainer.innerHTML = ""; 
        convertedResults.forEach(item => {
            const div = document.createElement('div');
            div.className = 'preview-item';
            div.innerHTML = `
                <img src="${item.data}" style="${isQualityBoosted ? 'image-rendering: auto;' : 'image-rendering: pixelated;'}">
                <p style="font-size:10px; margin:5px 0; overflow:hidden;">${item.name}</p>
                <a href="${item.data}" download="${item.name}" class="download-link"> Download ${ext.toUpperCase()}</a>
            `;
            previewContainer.appendChild(div);
        });
    }

    function downloadAllImages() {
        if (convertedResults.length === 0) {
            alert("আগে ছবি কনভার্ট করুন!");
            return;
        }

        convertedResults.forEach((item, index) => {
            setTimeout(() => {
                const link = document.createElement("a");
                link.href = item.data;
                link.download = item.name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }, index * 300); 
        });
    }

    async function convertToPDF() {
        if (convertedResults.length === 0) {
            alert("প্রথমে ছবিগুলো কনভার্ট করুন!");
            return;
        }

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            orientation: 'p',
            unit: 'px'
        });

        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();

        convertedResults.forEach((item, index) => {
            if (index > 0) pdf.addPage();
            
            const ratio = Math.min(pdfWidth / item.width, pdfHeight / item.height);
            const width = item.width * ratio;
            const height = item.height * ratio;
            const x = (pdfWidth - width) / 2;
            const y = (pdfHeight - height) / 2;

            pdf.addImage(item.data, 'JPEG', x, y, width, height);
        });

        pdf.save("converted_images.pdf");
    }
</script>

</body>
</html>
